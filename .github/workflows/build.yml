name: Build and Release Electron App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Set Version
        run: npm version 1.0.0 --no-git-tag-version --allow-same-version

      - name: Create Production Env File
        shell: bash
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # No hardcoded fallback: fail loudly rather than ship a release built
          # against a missing (or old, leaked) key. Set these in
          # Settings -> Secrets and variables -> Actions.
          if [ -z "${URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY repo secret."
            exit 1
          fi
          # Use printf to avoid shell interpretation. We use .env.production for the vite build.
          printf "VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\nVITE_AUTH_REDIRECT_URL=http://localhost:3000\n" "$URL" "$KEY" > .env.production

      - name: Build Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Clean Mac Detritus (Mac Only)
        if: matrix.os == 'macos-14'
        run: xattr -cr src public electron dist index.html package.json

      - name: Build Electron App (macOS)
        if: matrix.os == 'macos-14'
        run: npx electron-builder --mac --universal -p never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win -p never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HypotheSys-v1.0.0-${{ matrix.os }}
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.exe
            dist_electron/*.blockmap
